<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="262mm" height="365mm"
     viewBox="0 0 262 365">

  <rect width="262" height="365" fill="white"/>

  <!-- ===== TITLE ===== -->
  <text x="10" y="9" font-size="7.5" font-family="sans-serif" font-weight="bold" fill="#111">前身頃 Front Bodice ／ わ取り1枚（前中心＝わ）</text>
  <text x="10" y="16" font-size="5.5" font-family="sans-serif" fill="#555">縫い代：周囲1cm込み　前中心はわ（縫い代なし）</text>

  <!-- ===== GRID 50mm=5cm ===== -->
  <g stroke="#d8d8d8" stroke-width="0.3" fill="none">
    <line x1="10"  y1="20" x2="10"  y2="355"/>
    <line x1="60"  y1="20" x2="60"  y2="355"/>
    <line x1="110" y1="20" x2="110" y2="355"/>
    <line x1="160" y1="20" x2="160" y2="355"/>
    <line x1="210" y1="20" x2="210" y2="355"/>
    <line x1="242" y1="20" x2="242" y2="355"/>
    <line x1="10" y1="25"  x2="252" y2="25"/>
    <line x1="10" y1="75"  x2="252" y2="75"/>
    <line x1="10" y1="125" x2="252" y2="125"/>
    <line x1="10" y1="175" x2="252" y2="175"/>
    <line x1="10" y1="225" x2="252" y2="225"/>
    <line x1="10" y1="275" x2="252" y2="275"/>
    <line x1="10" y1="325" x2="252" y2="325"/>
  </g>
  <g font-size="5" fill="#bbb" font-family="sans-serif" text-anchor="middle">
    <text x="60"  y="20">5cm</text>
    <text x="110" y="20">10</text>
    <text x="160" y="20">15</text>
    <text x="210" y="20">20cm</text>
  </g>
  <g font-size="5" fill="#bbb" font-family="sans-serif">
    <text x="2" y="78">5</text>
    <text x="2" y="128">10</text>
    <text x="2" y="178">15</text>
    <text x="2" y="228">20</text>
    <text x="2" y="278">25</text>
    <text x="2" y="328">30cm</text>
  </g>

  <!-- ===== FOLD LINE (center front = わ) ===== -->
  <line x1="10" y1="20" x2="10" y2="355"
        stroke="#009900" stroke-width="0.8" stroke-dasharray="6,2,1,2"/>
  <text x="13" y="180" font-size="7" fill="#009900" font-family="sans-serif"
        transform="rotate(90,13,180)">わ（前中心・折り目）</text>

  <!-- ===== PATTERN OUTLINE ===== -->
  <!--
    Key coordinates:
    SNP      = (75, 25)   ← shoulder neck point (same level as FNP)
    SP       = (200, 45)  ← shoulder point
    UA       = (242, 235) ← underarm
    EmpSide  = (220, 345) ← empire seam at side (320mm below SNP)
    EmpCF    = (10, 345)  ← empire seam at center front
    NeckDeep = (10, 105)  ← front neckline deepest (80mm below SNP level)

    Front neckline: quarter-circle curve from SNP(75,25) sweeping down to deep(10,105)
    Curve via quadratic: Q 42,25 → arriving from (10,105)
    Actually: from (10,105) going up-right with control (42,25) to arrive (75,25)
  -->
  <path d="M 75,25
           L 200,45
           C 218,110 248,205 242,235
           L 220,345
           L 10,345
           L 10,105
           Q 42,25 75,25
           Z"
        fill="#FFF5EA" fill-opacity="0.6"
        stroke="black" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Empire seam line (blue dashed) -->
  <line x1="10" y1="345" x2="252" y2="345"
        stroke="#0055CC" stroke-width="0.6" stroke-dasharray="5,3"/>

  <!-- ===== EASE MARKS on empire seam (front) ===== -->
  <!-- Small gathering tilde at empire seam front, near CF -->
  <path d="M 30,343 Q 35,339 40,343 Q 45,347 50,343 Q 55,339 60,343"
        stroke="#CC4400" stroke-width="0.8" fill="none" stroke-dasharray="0"/>
  <text x="30" y="352" font-size="5" fill="#CC4400" font-family="sans-serif">イセ（1cm）胸の丸みを寄せる</text>

  <!-- ===== GRAIN LINE ===== -->
  <line x1="10" y1="200" x2="125" y2="200" stroke="#333" stroke-width="0.9"/>
  <polygon points="121,196.5 130,200 121,203.5" fill="#333"/>

  <!-- ===== NOTCHES ===== -->
  <line x1="196" y1="41" x2="204" y2="49" stroke="black" stroke-width="1.2"/>
  <line x1="238" y1="228" x2="246" y2="242" stroke="black" stroke-width="1.2"/>
  <line x1="113" y1="341" x2="113" y2="349" stroke="black" stroke-width="1.2"/>

  <!-- ===== KEY POINT DOTS ===== -->
  <circle cx="75"  cy="25"  r="1.8" fill="#333"/>
  <circle cx="200" cy="45"  r="1.8" fill="#333"/>
  <circle cx="242" cy="235" r="1.8" fill="#333"/>
  <circle cx="10"  cy="105" r="1.8" fill="#333"/>

  <!-- ===== LABELS ===== -->
  <g font-family="sans-serif" fill="#222">
    <text x="77"  y="23"  font-size="5">SNP</text>
    <text x="202" y="43"  font-size="5">SP</text>
    <text x="244" y="233" font-size="5">脇線</text>
    <text x="13"  y="103" font-size="5">衿ぐり底</text>
    <text x="60"  y="205" font-size="6.5" font-weight="bold">前</text>
    <text x="60"  y="214" font-size="5.5">地の目 →</text>
  </g>

  <!-- Neckline depth annotation -->
  <g stroke="#999" stroke-width="0.4">
    <line x1="6"  y1="25"  x2="6"  y2="105"/>
    <line x1="4"  y1="25"  x2="8"  y2="25"/>
    <line x1="4"  y1="105" x2="8"  y2="105"/>
  </g>
  <text x="4" y="68" font-size="5" fill="#777" font-family="sans-serif"
        transform="rotate(-90,4,68)">衿ぐり深さ 8cm</text>

  <!-- Empire line label -->
  <text x="80" y="342" font-size="5.5" fill="#0055CC" font-family="sans-serif">切り替え線（アンダーバスト）</text>

  <!-- Front bodice length -->
  <g stroke="#999" stroke-width="0.4">
    <line x1="252" y1="25"  x2="252" y2="345"/>
    <line x1="250" y1="25"  x2="254" y2="25"/>
    <line x1="250" y1="345" x2="254" y2="345"/>
  </g>
  <text x="256" y="188" font-size="5" fill="#777" font-family="sans-serif"
        transform="rotate(90,256,188)">前身丈 32cm</text>

  <!-- ===== NOTES ===== -->
  <text x="10" y="358" font-size="5.5" fill="#555" font-family="sans-serif">
    ※前中心で生地を折り（わ）1枚裁ち　切り替え線の「イセ」でバストの丸みを出す
  </text>
</svg>
