<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="330mm" height="640mm"
     viewBox="0 0 330 640">

  <title>ジャケット 袖（1ピース）</title>
  <rect width="330" height="640" fill="white"/>

  <!-- ===== メイン輪郭 ===== -->
  <!-- 前UA(10,152) → 袖山カーブ → 袖山頂点(160,10) → 袖山カーブ → 後UA(310,168)
       → 後袖線 → 袖口後(278,598) → 袖口(28,598) → 前袖線 → 前UA(10,152)
  -->
  <path d="
    M 10,152
    Q 10,100 65,45
    Q 108,14 160,10
    Q 212,14 255,45
    Q 310,100 310,168
    L 278,598
    L 28,598
    Z
  " fill="none" stroke="black" stroke-width="1.5"/>

  <!-- 袖山頂点ノッチ（肩合印）: 頂点(160,10)を挟む垂直ノッチ -->
  <line x1="160" y1="5" x2="160" y2="22" stroke="black" stroke-width="2"/>
  <!-- 肩ラベル: ノッチ右横、頂点より下に配置してクリップを回避 -->
  <text x="164" y="22" font-size="8" fill="#555">肩</text>

  <!-- 前袖山ノッチ（前合印）: 曲線 Q 10,100 65,45 上の approx (60,51) を挟む -->
  <!-- 法線方向 (-0.48, 0.877) に沿って 10px ノッチ -->
  <line x1="66" y1="45" x2="54" y2="57" stroke="black" stroke-width="2"/>
  <!-- 前ラベル: ノッチの外側（上左）に配置 -->
  <text x="55" y="40" font-size="7" fill="#555">前</text>

  <!-- 後ろ袖山ノッチ（後合印・2つ）
       第1ノッチ: 曲線 Q 212,14 255,45 上の approx (246,39) を挟む -->
  <line x1="243" y1="35" x2="249" y2="43" stroke="black" stroke-width="2"/>
  <!-- 第2ノッチ: 曲線 Q 310,100 310,168 上の approx (265,56) を挟む -->
  <line x1="261" y1="53" x2="269" y2="60" stroke="black" stroke-width="2"/>
  <!-- 後ラベル: 2つのノッチの右外側 -->
  <text x="272" y="55" font-size="7" fill="#555">後</text>

  <!-- 地の目線（縦・袖中央） -->
  <line x1="160" y1="50" x2="160" y2="565"
        stroke="black" stroke-width="0.8" stroke-dasharray="12,5"/>
  <polygon points="160,45 156,60 164,60" fill="black"/>
  <polygon points="160,570 156,555 164,555" fill="black"/>
  <text x="165" y="320" font-size="10" font-family="sans-serif">地の目</text>

  <!-- 袖口折り返しライン（袖口から3cm内側） -->
  <line x1="28" y1="568" x2="278" y2="568"
        stroke="#888" stroke-width="0.8" stroke-dasharray="6,4"/>
  <text x="80" y="562" font-size="8" font-family="sans-serif" fill="#888">折り返し線（袖口仕上げ）</text>

  <!-- ===== ラベル ===== -->
  <text x="100" y="280" font-size="15" font-weight="bold" font-family="sans-serif">袖（1ピース）</text>
  <text x="100" y="302" font-size="12" font-family="sans-serif">× 2枚（左右対称）</text>
  <text x="100" y="322" font-size="10" font-family="sans-serif">縫い代 10mm込み</text>
  <text x="100" y="338" font-size="10" font-family="sans-serif">袖口のみ 20mm込み</text>
  <text x="100" y="356" font-size="9" font-family="sans-serif" fill="#555">（袖口は三つ折りで仕上げ）</text>

  <!-- ===== 寸法線 ===== -->
  <!-- 袖山高さ: keep at x=318 (within 330 viewBox, rotated text stays clear) -->
  <line x1="318" y1="10"  x2="318" y2="168" stroke="#999" stroke-width="0.5"/>
  <line x1="316" y1="10"  x2="320" y2="10"  stroke="#999" stroke-width="0.5"/>
  <line x1="316" y1="168" x2="320" y2="168" stroke="#999" stroke-width="0.5"/>
  <text x="321" y="100" font-size="8" font-family="sans-serif" fill="#777"
        transform="rotate(90,321,100)">袖山 約14cm</text>

  <!-- 袖長さ（UA〜袖口）: move line to x=6 and rotate around x=11 -->
  <line x1="6" y1="152" x2="6" y2="598" stroke="#999" stroke-width="0.5"/>
  <line x1="4" y1="152" x2="8" y2="152" stroke="#999" stroke-width="0.5"/>
  <line x1="4" y1="598" x2="8" y2="598" stroke="#999" stroke-width="0.5"/>
  <text x="11" y="400" font-size="8" font-family="sans-serif" fill="#777"
        transform="rotate(-90,11,400)">袖丈 約44cm（UA〜袖口）</text>

  <!-- 袖幅（UA） -->
  <line x1="10" y1="165" x2="310" y2="165" stroke="#bbb" stroke-width="0.5" stroke-dasharray="4,3"/>
  <text x="110" y="177" font-size="8" font-family="sans-serif" fill="#bbb">袖口幅（二の腕）約30cm</text>

  <!-- 袖口幅 -->
  <line x1="28" y1="612" x2="278" y2="612" stroke="#bbb" stroke-width="0.5" stroke-dasharray="4,3"/>
  <text x="100" y="622" font-size="8" font-family="sans-serif" fill="#bbb">袖口幅 約25cm</text>

  <!-- ===== 注意書き ===== -->
  <text x="10" y="635" font-size="8" font-family="sans-serif" fill="#666">
    ※ニット素材のため1ピース袖。袖山ノッチ（前1・後2）を身頃に合わせること。
  </text>

</svg>
