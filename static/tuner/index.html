<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#aee4f8">
<title>うみチューナー</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;}
  html,body{height:100%;}
  body{
    font-family:"Hiragino Maru Gothic ProN","Hiragino Sans",-apple-system,sans-serif;
    background:linear-gradient(180deg,#c9ecfb 0%,#9fdcf6 30%,#5fb9e8 58%,#2f8fd0 78%,#1c6fae 100%);
    background-attachment:fixed;
    color:#0d3a5c;
    display:flex;flex-direction:column;align-items:center;
    padding:calc(env(safe-area-inset-top) + 14px) 18px calc(env(safe-area-inset-bottom) + 14px);
    min-height:100%;overflow-x:hidden;position:relative;
  }
  /* 太陽 */
  .sun{position:fixed;top:48px;right:34px;width:64px;height:64px;border-radius:50%;
    background:#fff3c4;box-shadow:0 0 60px 22px rgba(255,243,196,.75);
    transition:box-shadow .5s;z-index:0;}
  .sun.shine{background:#ffe98a;box-shadow:0 0 90px 40px rgba(255,233,138,.9);}
  /* 波 */
  .waves{position:fixed;bottom:0;left:0;width:200%;height:90px;z-index:0;opacity:.5;}
  .waves svg{width:100%;height:100%;}
  .w1{animation:drift 9s linear infinite;}
  .w2{animation:drift 14s linear infinite reverse;opacity:.6;position:fixed;bottom:8px;}
  @keyframes drift{from{transform:translateX(0)}to{transform:translateX(-50%)}}

  header{width:100%;max-width:440px;display:flex;justify-content:space-between;align-items:center;
    z-index:1;margin-bottom:10px;}
  header .logo{font-size:15px;font-weight:600;letter-spacing:.12em;color:#0d3a5c;}
  header .status{font-size:12px;color:#33688f;}
  .gearbtn{border:none;border-radius:50%;width:34px;height:34px;font-size:17px;
    color:#0d3a5c;background:rgba(255,255,255,.55);font-family:inherit;
    display:flex;align-items:center;justify-content:center;}
  .gearbtn:active{transform:scale(.94);}
  .settings{width:100%;max-width:440px;z-index:1;margin-bottom:10px;
    background:rgba(255,255,255,.82);border-radius:16px;padding:12px 14px;
    box-shadow:0 6px 20px rgba(13,58,92,.14);
    display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .settings label{font-size:12px;color:#4a85ad;display:flex;flex-direction:column;gap:6px;}
  .settings select{box-shadow:none;border:1px solid #cfe6f4;background:#fff;}
  .fwrap{grid-column:1/3;background:rgba(255,255,255,.82);border-radius:14px;
    padding:14px 12px;box-shadow:0 4px 14px rgba(13,58,92,.10);}
  .fname{text-align:center;font-size:19px;color:#0d3a5c;font-weight:600;}
  .fdiagram{display:flex;justify-content:center;margin:10px 0 4px;}
  .key{fill:#fff;stroke:#9cc9e6;stroke-width:2.5;}
  .key.on{fill:#0d6eb8;stroke:#0d6eb8;}
  .key.alt{fill:#ffd34d;stroke:#e0a800;}
  .klabel{fill:#7aa6c2;font-size:11px;font-family:inherit;}
  .fchips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 4px 0;}
  .chip{background:#e3f2fb;color:#0d3a5c;border-radius:99px;padding:4px 11px;font-size:12px;}
  .chipnone{color:#7aa6c2;font-size:12px;}
  .falt{text-align:center;font-size:11px;color:#7aa6c2;margin-top:8px;line-height:1.6;}
  .seclabel{font-size:11px;color:#4a85ad;margin:12px 2px 5px;}
  .frow{display:flex;flex-wrap:wrap;gap:5px;}
  .fnote{border:1px solid #cfe6f4;background:#fff;color:#0d3a5c;border-radius:9px;
    padding:7px 0;width:40px;font-size:13px;font-family:inherit;text-align:center;}
  .fnote.sel{background:#0d6eb8;color:#fff;border-color:#0d6eb8;}

  .card{
    width:100%;max-width:440px;z-index:1;
    background:rgba(255,255,255,.82);
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    border-radius:24px;padding:26px 20px 22px;
    box-shadow:0 10px 36px rgba(13,58,92,.16);
  }
  .doremi{text-align:center;line-height:1;}
  .note-row{height:108px;display:flex;align-items:center;justify-content:center;}
  .doremi .big{font-size:72px;font-weight:700;color:#0d3a5c;letter-spacing:.02em;
    width:216px;text-align:center;display:inline-block;white-space:nowrap;}
  .doremi .alpha{font-size:24px;color:#4a85ad;font-weight:600;
    width:58px;text-align:left;display:inline-block;font-variant-numeric:tabular-nums;}
  .doremi .sub{height:22px;font-size:14px;color:#4a85ad;font-variant-numeric:tabular-nums;}
  .doremi .sub b{color:#0d3a5c;font-weight:600;}

  .meter{position:relative;height:92px;margin:26px 6px 0;}
  .ticks{position:absolute;inset:0;display:flex;justify-content:space-between;align-items:flex-end;}
  .tk{width:1px;height:32%;background:#a9d3ea;border-radius:1px;}
  .tk.mj{width:2px;height:58%;background:#7ab5d8;}
  .tk.ctr{width:3px;height:100%;background:#1c87c9;border-radius:2px;}
  .marker{position:absolute;top:4px;left:50%;width:22px;height:22px;border-radius:50%;
    background:#7ab5d8;transform:translateX(-50%);
    transition:left .08s linear,background .2s,box-shadow .3s;}
  .marker.ok{background:#ffd34d;box-shadow:0 0 18px 6px rgba(255,211,77,.65);}
  .marker.near{background:#5fb9e8;}
  .mlabels{display:flex;justify-content:space-between;font-size:11px;color:#4a85ad;margin:6px 8px 0;}
  .cents{text-align:center;font-size:18px;color:#4a85ad;height:24px;margin-top:12px;
    font-variant-numeric:tabular-nums;}
  .cents.ok{color:#d99a00;font-weight:600;}

  .praise{text-align:center;height:30px;margin-top:6px;font-size:17px;color:#1c87c9;
    opacity:0;transition:opacity .5s;font-weight:600;letter-spacing:.04em;}
  .praise.show{opacity:1;}

  .stats{display:flex;justify-content:center;gap:8px;margin-top:10px;z-index:1;
    font-size:13px;color:#e8f6ff;align-items:center;}
  .stats .count{background:rgba(255,255,255,.28);border-radius:99px;padding:6px 16px;
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:#fff;font-weight:600;}

  .controls{width:100%;max-width:440px;margin-top:14px;z-index:1;display:grid;
    grid-template-columns:1fr 1fr;gap:10px;}
  select{
    width:100%;padding:11px;border-radius:14px;border:none;font-size:14px;text-align:center;
    background:rgba(255,255,255,.82);color:#0d3a5c;
    -webkit-appearance:none;appearance:none;font-family:inherit;
    box-shadow:0 4px 14px rgba(13,58,92,.10);
  }
  .tonebtn{border:none;border-radius:14px;padding:13px 6px;font-size:15px;
    font-weight:600;font-family:inherit;color:#0d3a5c;background:rgba(255,255,255,.82);
    box-shadow:0 4px 14px rgba(13,58,92,.10);}
  .tonebtn:active{transform:scale(.98);}
  .tonebtn.playing{background:#ffd34d;color:#5c4400;
    box-shadow:0 0 18px 4px rgba(255,211,77,.55);}
  .gobtn{grid-column:1/3;border:none;border-radius:16px;padding:16px;font-size:17px;
    font-weight:700;font-family:inherit;color:#fff;background:#0d6eb8;
    box-shadow:0 6px 20px rgba(13,58,92,.3);}
  .gobtn:active{transform:scale(.98);}
  .gobtn.stop{background:rgba(255,255,255,.85);color:#0d3a5c;}
  .hint{grid-column:1/3;text-align:center;font-size:12px;color:#e8f6ff;line-height:1.7;}
</style>
</head>
<body>
  <div class="sun" id="sun"></div>

  <header>
    <span class="logo">うみチューナー</span>
    <span style="display:flex;align-items:center;gap:10px;">
      <span class="status" id="status">とまっています</span>
      <button class="gearbtn" id="gear" aria-label="設定">⚙</button>
    </span>
  </header>

  <div class="settings" id="settings" style="display:none;">
    <label>楽器
      <select id="transpose">
        <option value="alto" selected>アルトサックス</option>
        <option value="flute">フルート</option>
        <option value="trumpet">トランペット</option>
        <option value="ukulele">ウクレレ</option>
      </select>
    </label>
    <label>基準ピッチ
      <select id="refA">
        <option value="440">A = 440</option>
        <option value="441">A = 441</option>
        <option value="442" selected>A = 442</option>
        <option value="443">A = 443</option>
      </select>
    </label>
  </div>

  <div class="card">
    <div class="doremi">
      <div class="note-row"><span class="big" id="big">&ndash;</span><span class="alpha" id="alpha"></span></div>
      <div class="sub" id="sub">マイクをオンにして、音をひとつのばしてみて</div>
    </div>
    <div class="meter">
      <div class="ticks" id="ticks"></div>
      <div class="marker" id="marker"></div>
    </div>
    <div class="mlabels"><span>&#9837; ひくい</span><span>ぴったり</span><span>たかい &#9839;</span></div>
    <div class="cents" id="cents"></div>
    <div class="praise" id="praise"></div>
  </div>

  <div class="stats">
    <span class="count" id="count">きょうのぴったり 0回</span>
  </div>

  <div class="controls">
    <select id="toneNote">
      <option value="-9">C</option>
      <option value="-8">C♯</option>
      <option value="-7">D</option>
      <option value="-6">E♭</option>
      <option value="-5">E</option>
      <option value="-4">F</option>
      <option value="-3">F♯</option>
      <option value="-2">G</option>
      <option value="-1">G♯</option>
      <option value="0">A</option>
      <option value="1" selected>B♭</option>
      <option value="2">B</option>
    </select>
    <button class="tonebtn" id="tone">♪ 鳴らす</button>
    <button class="gobtn" id="toggle">はじめる</button>
    <button class="tonebtn" id="chartBtn" style="grid-column:1/3;">実音の早見表</button>
    <div id="chart" style="display:none;grid-column:1/3;background:rgba(255,255,255,.82);border-radius:14px;padding:14px 12px;box-shadow:0 4px 14px rgba(13,58,92,.10);">
      <div style="font-size:12px;color:#4a85ad;text-align:center;margin-bottom:10px;">実音 → 吹く音</div>
      <div id="chartGrid" style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px 6px;text-align:center;font-size:14px;color:#0d3a5c;"></div>
    </div>
    <button class="tonebtn" id="fingerBtn" style="grid-column:1/3;">サックスの運指表</button>
    <div class="fwrap" id="finger" style="display:none;">
      <div class="fname" id="fname">ラ（中音）</div>
      <div class="fdiagram">
        <svg viewBox="0 0 210 244" width="200" height="232" role="img" aria-label="運指図">
          <line x1="100" y1="20" x2="100" y2="118" stroke="#dceefa" stroke-width="6"/>
          <line x1="100" y1="144" x2="100" y2="224" stroke="#dceefa" stroke-width="6"/>
          <text class="klabel" x="30" y="22" text-anchor="middle">パーム</text>
          <circle class="key" id="k_pD" cx="30" cy="40" r="8"/>
          <circle class="key" id="k_pEb" cx="30" cy="64" r="8"/>
          <circle class="key" id="k_pF" cx="30" cy="88" r="8"/>
          <circle class="key" id="k_oct" cx="30" cy="170" r="11"/>
          <text class="klabel" x="30" y="194" text-anchor="middle">オク</text>
          <circle class="key" id="k_l1" cx="100" cy="34" r="15"/>
          <circle class="key" id="k_bis" cx="126" cy="48" r="7"/>
          <text class="klabel" x="137" y="52">bis</text>
          <circle class="key" id="k_l2" cx="100" cy="76" r="15"/>
          <circle class="key" id="k_l3" cx="100" cy="118" r="15"/>
          <circle class="key" id="k_r1" cx="100" cy="160" r="15"/>
          <circle class="key" id="k_r2" cx="100" cy="192" r="15"/>
          <circle class="key" id="k_r3" cx="100" cy="224" r="15"/>
          <text class="klabel" x="78" y="38" text-anchor="end">左1</text>
          <text class="klabel" x="78" y="80" text-anchor="end">左2</text>
          <text class="klabel" x="78" y="122" text-anchor="end">左3</text>
          <text class="klabel" x="78" y="164" text-anchor="end">右1</text>
          <text class="klabel" x="78" y="196" text-anchor="end">右2</text>
          <text class="klabel" x="78" y="228" text-anchor="end">右3</text>
          <circle class="key" id="k_sE" cx="152" cy="150" r="8"/>
          <text class="klabel" x="164" y="154">高ミ</text>
          <circle class="key" id="k_sC" cx="152" cy="174" r="8"/>
          <text class="klabel" x="164" y="178">ド</text>
          <circle class="key" id="k_sBb" cx="152" cy="198" r="8"/>
          <text class="klabel" x="164" y="202">♭シ</text>
          <circle class="key" id="k_hfs" cx="152" cy="224" r="8"/>
          <text class="klabel" x="164" y="228">高F♯</text>
        </svg>
      </div>
      <div class="fchips" id="fchips"></div>
      <div class="falt" id="falt"></div>
      <div class="seclabel">低音域</div><div class="frow" id="rowLow"></div>
      <div class="seclabel">中音域</div><div class="frow" id="rowMid"></div>
      <div class="seclabel">高音域（パームキー）</div><div class="frow" id="rowHigh"></div>
    </div>
    <div class="hint">マーカーが真ん中で金色に光ったらぴったり<br>大きい文字はいまの楽器での音名（実音は下に表示）</div>
  </div>

  <div class="waves">
    <svg class="w1" viewBox="0 0 1200 90" preserveAspectRatio="none">
      <path d="M0,40 C150,70 300,10 450,40 C600,70 750,10 900,40 C1050,70 1200,10 1350,40 L1350,90 L0,90 Z" fill="#1c6fae"/>
    </svg>
  </div>

<script>
const ticks=document.getElementById('ticks');
for(let i=-50;i<=50;i+=5){
  const t=document.createElement('div');
  t.className='tk'+(i===0?' ctr':(i%25===0?' mj':''));
  ticks.appendChild(t);
}

const DOREMI=['ド','ド♯','レ','レ♯','ミ','ファ','ファ♯','ソ','ソ♯','ラ','ラ♯','シ'];
const INSTR={alto:9,flute:0,trumpet:2,ukulele:0};  // 実音→記譜の移調（半音）
const ALPHA=['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];
const PRAISE=['いい音','のびてる、そのまま','澄んでる','まっすぐ届いてる','海までとどきそう','今日の音、きれい'];

const $=id=>document.getElementById(id);
const el={big:$('big'),alpha:$('alpha'),sub:$('sub'),cents:$('cents'),marker:$('marker'),
  status:$('status'),toggle:$('toggle'),praise:$('praise'),sun:$('sun'),count:$('count'),
  transpose:$('transpose'),refA:$('refA')};

// きょうのぴったりカウンター
const todayKey='umituner_'+new Date().toISOString().slice(0,10);
let hits=parseInt(localStorage.getItem(todayKey)||'0');
el.count.textContent='きょうのぴったり '+hits+'回';

let audioCtx,analyser,buf,rafId,stream,running=false;
let okFrames=0,counted=false,praiseTimer=null;
let emaExact=null,curMidi=null,switchFrames=0,silentFrames=0;
let lastSoundTs=0;
const AUTO_OFF_MS=90000;  // 無音が90秒つづいたら自動でとめる（マイク切り忘れ防止）

async function start(){
  try{
    stream=await navigator.mediaDevices.getUserMedia({audio:{
      echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
  }catch(e){
    el.sub.textContent='マイクの許可が必要です（設定から許可してね）';
    return;
  }
  audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  const src=audioCtx.createMediaStreamSource(stream);
  analyser=audioCtx.createAnalyser();
  analyser.fftSize=2048;
  buf=new Float32Array(analyser.fftSize);
  src.connect(analyser);
  running=true;
  lastSoundTs=performance.now();
  el.status.textContent='きいています';
  el.toggle.textContent='とめる';el.toggle.classList.add('stop');
  update();
}
function autoStop(){
  stop();
  el.status.textContent='じどうでとめました';
  el.sub.textContent='音がしばらくなかったので、マイクをとめました';
}
function stop(){
  running=false;cancelAnimationFrame(rafId);
  if(stream)stream.getTracks().forEach(t=>t.stop());
  if(audioCtx)audioCtx.close();
  emaExact=null;curMidi=null;switchFrames=0;silentFrames=0;
  el.status.textContent='とまっています';
  el.toggle.textContent='はじめる';el.toggle.classList.remove('stop');
  el.big.textContent='–';el.alpha.textContent='';
  el.sub.textContent='マイクをオンにして、音をひとつのばしてみて';
  el.cents.textContent='';el.marker.style.left='50%';
  el.marker.className='marker';el.sun.classList.remove('shine');
}

function autoCorrelate(b,sampleRate){
  let SIZE=b.length,rms=0;
  for(let i=0;i<SIZE;i++)rms+=b[i]*b[i];
  rms=Math.sqrt(rms/SIZE);
  if(rms<0.01)return -1;
  let r1=0,r2=SIZE-1,thres=0.2;
  for(let i=0;i<SIZE/2;i++)if(Math.abs(b[i])<thres){r1=i;break;}
  for(let i=1;i<SIZE/2;i++)if(Math.abs(b[SIZE-i])<thres){r2=SIZE-i;break;}
  b=b.slice(r1,r2);SIZE=b.length;
  const c=new Array(SIZE).fill(0);
  for(let i=0;i<SIZE;i++)for(let j=0;j<SIZE-i;j++)c[i]+=b[j]*b[j+i];
  let d=0;while(c[d]>c[d+1])d++;
  let maxval=-1,maxpos=-1;
  for(let i=d;i<SIZE;i++){if(c[i]>maxval){maxval=c[i];maxpos=i;}}
  let T0=maxpos;
  if(T0<=0)return -1;
  const x1=c[T0-1],x2=c[T0],x3=c[T0+1]||0;
  const a=(x1+x3-2*x2)/2,bb=(x3-x1)/2;
  if(a)T0=T0-bb/(2*a);
  return sampleRate/T0;
}

function showPraise(){
  el.praise.textContent=PRAISE[Math.floor(Math.random()*PRAISE.length)];
  el.praise.classList.add('show');
  clearTimeout(praiseTimer);
  praiseTimer=setTimeout(()=>el.praise.classList.remove('show'),2200);
}

function update(){
  analyser.getFloatTimeDomainData(buf);
  const freq=autoCorrelate(buf,audioCtx.sampleRate);
  if(freq!==-1&&freq>40&&freq<2000){
    silentFrames=0;
    lastSoundTs=performance.now();
    const refA=parseFloat(el.refA.value);
    const tp=INSTR[el.transpose.value]||0;
    const exact=12*Math.log2(freq/refA)+69;
    // なめらかにする（1フレームごとの揺れを吸収）
    emaExact=(emaExact===null)?exact:emaExact*0.6+exact*0.4;
    // 音名は「となりの音に十分入った状態が続いたとき」だけ切り替える
    if(curMidi===null){
      curMidi=Math.round(emaExact);switchFrames=0;
    }else if(Math.abs(emaExact-curMidi)>0.65){
      switchFrames++;
      if(switchFrames>=5){curMidi=Math.round(emaExact);switchFrames=0;}
    }else{
      switchFrames=0;
    }
    const midi=curMidi;
    const cents=Math.round((emaExact-midi)*100);
    const w=midi+tp;                       // 記譜（アルトサックスの音）
    const wName=(el.transpose.value==='ukulele')?ALPHA[((w%12)+12)%12]:DOREMI[((w%12)+12)%12];
    const wAlpha=ALPHA[((w%12)+12)%12];
    const wOct=Math.floor(w/12)-1;
    const cName=ALPHA[((midi%12)+12)%12];  // 実音
    const cOct=Math.floor(midi/12)-1;
    el.big.textContent=wName;
    el.alpha.textContent=wAlpha+wOct;
    el.sub.innerHTML='実音 <b>'+cName+cOct+'</b>　'+freq.toFixed(1)+' Hz';
    const pos=50+Math.max(-50,Math.min(50,cents));
    el.marker.style.left=pos+'%';
    const inTune=Math.abs(cents)<=5;
    el.marker.className='marker '+(inTune?'ok':(Math.abs(cents)<15?'near':''));
    el.cents.textContent=(cents>0?'+':'')+cents+' cent';
    el.cents.className='cents'+(inTune?' ok':'');
    el.sun.classList.toggle('shine',inTune);
    if(inTune){
      okFrames++;
      if(okFrames>=45&&!counted){   // 約0.75秒キープでカウント
        counted=true;hits++;
        localStorage.setItem(todayKey,hits);
        el.count.textContent='きょうのぴったり '+hits+'回';
        showPraise();
      }
    }else{
      okFrames=0;counted=false;
    }
  }else{
    // 無音が続いたら追従をリセット（次の音の出だしで素早くロック）
    silentFrames++;
    if(silentFrames>20){emaExact=null;curMidi=null;switchFrames=0;}
    // 無音が長くつづいたら自動でとめる（マイク切り忘れ防止）
    if(performance.now()-lastSoundTs>AUTO_OFF_MS){autoStop();return;}
  }
  rafId=requestAnimationFrame(update);
}

el.toggle.addEventListener('click',()=>running?stop():start());

// 画面を消したり別アプリに切り替えたら、マイクをとめる（切り忘れ防止）
document.addEventListener('visibilitychange',()=>{
  if(document.hidden&&running){
    stop();el.status.textContent='とまっています';
  }
});

// 基準音を鳴らす（音はメニューで選択・既定はシ♭）
const toneBtn=document.getElementById('tone');
const toneNote=document.getElementById('toneNote');
let toneCtx=null,toneOscs=[],toneGain=null,tonePlaying=false;
function startTone(){
  toneCtx=new (window.AudioContext||window.webkitAudioContext)();
  if(toneCtx.state==='suspended')toneCtx.resume();
  const f=parseFloat(el.refA.value)*Math.pow(2,parseInt(toneNote.value)/12);
  toneGain=toneCtx.createGain();
  toneGain.gain.setValueAtTime(0,toneCtx.currentTime);
  toneGain.gain.linearRampToValueAtTime(0.22,toneCtx.currentTime+0.08);
  toneGain.connect(toneCtx.destination);
  // 純音だと耳に刺さるので、倍音を少し足してやわらかい音にする
  [[1,1],[2,0.18],[3,0.06]].forEach(([h,g])=>{
    const o=toneCtx.createOscillator(),og=toneCtx.createGain();
    o.type='sine';o.frequency.value=f*h;og.gain.value=g;
    o.connect(og);og.connect(toneGain);o.start();toneOscs.push(o);
  });
  tonePlaying=true;
  toneBtn.textContent='♪ とめる';
  toneBtn.classList.add('playing');
}
function stopTone(){
  const ctx=toneCtx,oscs=toneOscs;
  if(toneGain&&ctx){
    toneGain.gain.setValueAtTime(toneGain.gain.value,ctx.currentTime);
    toneGain.gain.linearRampToValueAtTime(0,ctx.currentTime+0.12);
  }
  setTimeout(()=>{oscs.forEach(o=>{try{o.stop()}catch(e){}});if(ctx)ctx.close();},200);
  toneCtx=null;toneOscs=[];toneGain=null;tonePlaying=false;
  toneBtn.textContent='♪ 鳴らす';
  toneBtn.classList.remove('playing');
}
toneBtn.addEventListener('click',()=>tonePlaying?stopTone():startTone());
// 鳴らしている最中に音や基準ピッチを変えたら、新しい音で鳴らし直す
function retune(){if(tonePlaying){stopTone();setTimeout(startTone,220);}}
toneNote.addEventListener('change',retune);
el.refA.addEventListener('change',retune);

// 設定パネル（楽器・基準ピッチ）の開閉と記憶
const gear=document.getElementById('gear');
const settings=document.getElementById('settings');
gear.addEventListener('click',()=>{
  settings.style.display=(settings.style.display==='none')?'grid':'none';
});
const savedInst=localStorage.getItem('umituner_inst');
if(savedInst&&INSTR[savedInst]!==undefined)el.transpose.value=savedInst;
const savedRefA=localStorage.getItem('umituner_refA');
if(savedRefA)el.refA.value=savedRefA;
el.transpose.addEventListener('change',()=>{
  localStorage.setItem('umituner_inst',el.transpose.value);
  updateInstrUI();
});
el.refA.addEventListener('change',()=>localStorage.setItem('umituner_refA',el.refA.value));

// 実音→吹く音の早見表（移調楽器のときだけ表示）
const chartBtn=document.getElementById('chartBtn');
const chart=document.getElementById('chart');
const chartGrid=document.getElementById('chartGrid');
const CONCERT=[['C',0],['D♭',1],['D',2],['E♭',3],['E',4],['F',5],['F♯',6],['G',7],['A♭',8],['A',9],['B♭',10],['B',11]];
function buildChart(){
  const tp=INSTR[el.transpose.value]||0;
  if(tp===0){
    chartBtn.style.display='none';chart.style.display='none';
    chartBtn.textContent='実音の早見表';
    return;
  }
  chartBtn.style.display='';
  chartGrid.innerHTML=CONCERT.map(([nm,pc])=>
    '<div><b>'+nm+'</b> → '+DOREMI[(pc+tp)%12]+'</div>').join('');
}
chartBtn.addEventListener('click',()=>{
  const open=chart.style.display!=='none';
  chart.style.display=open?'none':'block';
  chartBtn.textContent=open?'実音の早見表':'早見表をとじる';
});

// アルトサックスの運指表（記譜音・押さえるキーが光る）
// キー：oct=オクターブ／l1l2l3=左手1〜3／r1r2r3=右手1〜3／bis＝バイスシ♭
//       gs=ソ♯小指 lcs=低ド♯ lb=低シ lbb=低シ♭ eb=低ミ♭小指 c=低ド小指
//       sBb/sC/sE=サイドキー pD/pEb/pF=パームキー hfs=高ファ♯
const FING={
  low:[
    ['シ♭',['l1','l2','l3','r1','r2','r3','lbb']],
    ['シ',['l1','l2','l3','r1','r2','r3','lb']],
    ['ド',['l1','l2','l3','r1','r2','r3','c']],
    ['ド♯',['l1','l2','l3','r1','r2','r3','lcs']],
    ['レ',['l1','l2','l3','r1','r2','r3']],
    ['ミ♭',['l1','l2','l3','r1','r2','r3','eb']],
    ['ミ',['l1','l2','l3','r1','r2']],
    ['ファ',['l1','l2','l3','r1']],
    ['ファ♯',['l1','l2','l3','r2'],'別運指：左1・2・3＋サイドのファ♯でも出せます'],
    ['ソ',['l1','l2','l3']],
    ['ソ♯',['l1','l2','l3','gs']],
    ['ラ',['l1','l2']],
    ['シ♭',['l1'],['sBb','bis'],'金色のキーは どちらか1つを押せばOK（サイドのシ♭か bis）'],
    ['シ',['l1']],
    ['ド',['l2'],'左手の中指だけ'],
    ['ド♯',[],'指は全部はなす（オクターブもなし）']
  ],
  mid:[
    ['レ',['oct','l1','l2','l3','r1','r2','r3']],
    ['ミ♭',['oct','l1','l2','l3','r1','r2','r3','eb']],
    ['ミ',['oct','l1','l2','l3','r1','r2']],
    ['ファ',['oct','l1','l2','l3','r1']],
    ['ファ♯',['oct','l1','l2','l3','r2']],
    ['ソ',['oct','l1','l2','l3']],
    ['ソ♯',['oct','l1','l2','l3','gs']],
    ['ラ',['oct','l1','l2']],
    ['シ♭',['oct','l1'],['sBb','bis'],'金色のキーは どちらか1つを押せばOK（サイドのシ♭か bis）'],
    ['シ',['oct','l1']],
    ['ド',['oct','l2']],
    ['ド♯',['oct'],'オクターブキーだけ（指は全部はなす）']
  ],
  high:[
    ['レ',['oct','pD']],
    ['ミ♭',['oct','pD','pEb']],
    ['ミ',['oct','pD','pEb','sE']],
    ['ファ',['oct','pD','pEb','pF','sE']],
    ['ファ♯',['oct','pD','pEb','pF','sE','hfs']]
  ]
};
const AUX={
  gs:'ソ♯（左小指）',lcs:'低ド♯（左小指）',lb:'低シ（左小指）',lbb:'低シ♭（左小指）',
  eb:'低ミ♭（右小指）',c:'低ド（右小指）',
  sBb:'サイド シ♭',sC:'サイド ド',sE:'サイド 高ミ',hfs:'高ファ♯キー',
  pD:'パーム レ',pEb:'パーム ミ♭',pF:'パーム ファ'
};
const DIAG=['oct','l1','l2','l3','r1','r2','r3','bis','pD','pEb','pF','sE','sC','sBb','hfs'];
const AUXORDER=['gs','lcs','lb','lbb','eb','c'];  // 図にないキー（小指）だけチップ表示
const SECLABEL={low:'低音',mid:'中音',high:'高音'};
const fingerBtn=document.getElementById('fingerBtn');
const finger=document.getElementById('finger');
const fname=document.getElementById('fname');
const fchips=document.getElementById('fchips');
const falt=document.getElementById('falt');
function renderF(sec,i){
  const it=FING[sec][i];
  const main=new Set(it[1]);
  let alt=new Set(),note='';
  if(Array.isArray(it[2])){alt=new Set(it[2]);note=it[3]||'';}
  else if(typeof it[2]==='string'){note=it[2];}
  fname.textContent=it[0]+'（'+SECLABEL[sec]+'）';
  DIAG.forEach(id=>{
    const el=document.getElementById('k_'+id);
    el.classList.remove('on','alt');
    if(main.has(id))el.classList.add('on');
    else if(alt.has(id))el.classList.add('alt');
  });
  const chips=AUXORDER.filter(id=>main.has(id)||alt.has(id)).map(id=>'<span class="chip">'+AUX[id]+'</span>').join('');
  fchips.innerHTML=chips||(alt.size?'':'<span class="chipnone">補助キーなし</span>');
  falt.textContent=note;
  document.querySelectorAll('.fnote').forEach(b=>b.classList.remove('sel'));
  const btn=document.querySelector('.fnote[data-k="'+sec+i+'"]');
  if(btn)btn.classList.add('sel');
}
['low','mid','high'].forEach(sec=>{
  const row=document.getElementById('row'+sec.charAt(0).toUpperCase()+sec.slice(1));
  row.innerHTML=FING[sec].map((it,i)=>'<button class="fnote" data-k="'+sec+i+'">'+it[0]+'</button>').join('');
});
finger.addEventListener('click',e=>{
  const b=e.target.closest('.fnote');if(!b)return;
  const m=b.dataset.k.match(/^([a-z]+)(\d+)$/);
  renderF(m[1],parseInt(m[2]));
});
renderF('mid',7);  // 既定：中音のラ
fingerBtn.addEventListener('click',()=>{
  const open=finger.style.display!=='none';
  finger.style.display=open?'none':'block';
  fingerBtn.textContent=open?'サックスの運指表':'運指表をとじる';
});

// 楽器に応じて早見表・運指表の出し分け（運指表はアルトサックスのみ）
function updateInstrUI(){
  buildChart();
  const isAlto=el.transpose.value==='alto';
  fingerBtn.style.display=isAlto?'':'none';
  if(!isAlto){finger.style.display='none';fingerBtn.textContent='サックスの運指表';}
}
updateInstrUI();
</script>
