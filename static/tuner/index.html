<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#aee4f8">
<title>うみチューナー</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;}
  html,body{height:100%;}
  body{
    font-family:"Hiragino Maru Gothic ProN","Hiragino Sans",-apple-system,sans-serif;
    background:linear-gradient(180deg,#c9ecfb 0%,#9fdcf6 30%,#5fb9e8 58%,#2f8fd0 78%,#1c6fae 100%);
    background-attachment:fixed;
    color:#0d3a5c;
    display:flex;flex-direction:column;align-items:center;
    padding:calc(env(safe-area-inset-top) + 14px) 18px calc(env(safe-area-inset-bottom) + 14px);
    min-height:100%;overflow-x:hidden;position:relative;
  }
  /* 太陽 */
  .sun{position:fixed;top:48px;right:34px;width:64px;height:64px;border-radius:50%;
    background:#fff3c4;box-shadow:0 0 60px 22px rgba(255,243,196,.75);
    transition:box-shadow .5s;z-index:0;}
  .sun.shine{background:#ffe98a;box-shadow:0 0 90px 40px rgba(255,233,138,.9);}
  /* 波 */
  .waves{position:fixed;bottom:0;left:0;width:200%;height:90px;z-index:0;opacity:.5;}
  .waves svg{width:100%;height:100%;}
  .w1{animation:drift 9s linear infinite;}
  .w2{animation:drift 14s linear infinite reverse;opacity:.6;position:fixed;bottom:8px;}
  @keyframes drift{from{transform:translateX(0)}to{transform:translateX(-50%)}}

  header{width:100%;max-width:440px;display:flex;justify-content:space-between;align-items:center;
    z-index:1;margin-bottom:10px;}
  header .logo{font-size:15px;font-weight:600;letter-spacing:.12em;color:#0d3a5c;}
  header .status{font-size:12px;color:#33688f;}

  .card{
    width:100%;max-width:440px;z-index:1;
    background:rgba(255,255,255,.82);
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    border-radius:24px;padding:26px 20px 22px;
    box-shadow:0 10px 36px rgba(13,58,92,.16);
  }
  .doremi{text-align:center;line-height:1;}
  .doremi .big{font-size:92px;font-weight:700;color:#0d3a5c;letter-spacing:.02em;}
  .doremi .big.small-kana{font-size:72px;}
  .doremi .alpha{font-size:24px;color:#4a85ad;margin-left:8px;font-weight:600;}
  .doremi .sub{margin-top:12px;font-size:14px;color:#4a85ad;font-variant-numeric:tabular-nums;}
  .doremi .sub b{color:#0d3a5c;font-weight:600;}

  .meter{position:relative;height:92px;margin:26px 6px 0;}
  .ticks{position:absolute;inset:0;display:flex;justify-content:space-between;align-items:flex-end;}
  .tk{width:1px;height:32%;background:#a9d3ea;border-radius:1px;}
  .tk.mj{width:2px;height:58%;background:#7ab5d8;}
  .tk.ctr{width:3px;height:100%;background:#1c87c9;border-radius:2px;}
  .marker{position:absolute;top:4px;left:50%;width:22px;height:22px;border-radius:50%;
    background:#7ab5d8;transform:translateX(-50%);
    transition:left .08s linear,background .2s,box-shadow .3s;}
  .marker.ok{background:#ffd34d;box-shadow:0 0 18px 6px rgba(255,211,77,.65);}
  .marker.near{background:#5fb9e8;}
  .mlabels{display:flex;justify-content:space-between;font-size:11px;color:#4a85ad;margin:6px 8px 0;}
  .cents{text-align:center;font-size:18px;color:#4a85ad;height:24px;margin-top:12px;
    font-variant-numeric:tabular-nums;}
  .cents.ok{color:#d99a00;font-weight:600;}

  .praise{text-align:center;height:30px;margin-top:6px;font-size:17px;color:#1c87c9;
    opacity:0;transition:opacity .5s;font-weight:600;letter-spacing:.04em;}
  .praise.show{opacity:1;}

  .stats{display:flex;justify-content:center;gap:8px;margin-top:10px;z-index:1;
    font-size:13px;color:#e8f6ff;align-items:center;}
  .stats .count{background:rgba(255,255,255,.28);border-radius:99px;padding:6px 16px;
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:#fff;font-weight:600;}

  .controls{width:100%;max-width:440px;margin-top:14px;z-index:1;display:grid;
    grid-template-columns:1fr 1fr;gap:10px;}
  select{
    width:100%;padding:11px;border-radius:14px;border:none;font-size:14px;text-align:center;
    background:rgba(255,255,255,.82);color:#0d3a5c;
    -webkit-appearance:none;appearance:none;font-family:inherit;
    box-shadow:0 4px 14px rgba(13,58,92,.10);
  }
  .gobtn{grid-column:1/3;border:none;border-radius:16px;padding:16px;font-size:17px;
    font-weight:700;font-family:inherit;color:#fff;background:#0d6eb8;
    box-shadow:0 6px 20px rgba(13,58,92,.3);}
  .gobtn:active{transform:scale(.98);}
  .gobtn.stop{background:rgba(255,255,255,.85);color:#0d3a5c;}
  .hint{grid-column:1/3;text-align:center;font-size:12px;color:#e8f6ff;line-height:1.7;}
</style>
</head>
<body>
  <div class="sun" id="sun"></div>

  <header>
    <span class="logo">うみチューナー</span>
    <span class="status" id="status">とまっています</span>
  </header>

  <div class="card">
    <div class="doremi">
      <span class="big" id="big">&ndash;</span><span class="alpha" id="alpha"></span>
      <div class="sub" id="sub">マイクをオンにして、音をひとつのばしてみて</div>
    </div>
    <div class="meter">
      <div class="ticks" id="ticks"></div>
      <div class="marker" id="marker"></div>
    </div>
    <div class="mlabels"><span>&#9837; ひくい</span><span>ぴったり</span><span>たかい &#9839;</span></div>
    <div class="cents" id="cents"></div>
    <div class="praise" id="praise"></div>
  </div>

  <div class="stats">
    <span class="count" id="count">きょうのぴったり 0回</span>
  </div>

  <div class="controls">
    <select id="transpose">
      <option value="9" selected>アルトサックス（E♭）</option>
      <option value="2">B♭管（クラ・Tp・テナー）</option>
      <option value="7">F管（ホルン）</option>
      <option value="0">実音（C）</option>
    </select>
    <select id="refA">
      <option value="440">A = 440</option>
      <option value="441">A = 441</option>
      <option value="442" selected>A = 442</option>
      <option value="443">A = 443</option>
    </select>
    <button class="gobtn" id="toggle">はじめる</button>
    <div class="hint">マーカーが真ん中で金色に光ったらぴったり<br>大きい文字はアルトサックスの音名（実音は下に表示）</div>
  </div>

  <div class="waves">
    <svg class="w1" viewBox="0 0 1200 90" preserveAspectRatio="none">
      <path d="M0,40 C150,70 300,10 450,40 C600,70 750,10 900,40 C1050,70 1200,10 1350,40 L1350,90 L0,90 Z" fill="#1c6fae"/>
    </svg>
  </div>

<script>
const ticks=document.getElementById('ticks');
for(let i=-50;i<=50;i+=5){
  const t=document.createElement('div');
  t.className='tk'+(i===0?' ctr':(i%25===0?' mj':''));
  ticks.appendChild(t);
}

const DOREMI=['ド','ド♯','レ','レ♯','ミ','ファ','ファ♯','ソ','ソ♯','ラ','ラ♯','シ'];
const ALPHA=['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];
const PRAISE=['いい音','のびてる、そのまま','澄んでる','まっすぐ届いてる','海までとどきそう','今日の音、きれい'];

const $=id=>document.getElementById(id);
const el={big:$('big'),alpha:$('alpha'),sub:$('sub'),cents:$('cents'),marker:$('marker'),
  status:$('status'),toggle:$('toggle'),praise:$('praise'),sun:$('sun'),count:$('count'),
  transpose:$('transpose'),refA:$('refA')};

// きょうのぴったりカウンター
const todayKey='umituner_'+new Date().toISOString().slice(0,10);
let hits=parseInt(localStorage.getItem(todayKey)||'0');
el.count.textContent='きょうのぴったり '+hits+'回';

let audioCtx,analyser,buf,rafId,stream,running=false;
let okFrames=0,counted=false,praiseTimer=null;

async function start(){
  try{
    stream=await navigator.mediaDevices.getUserMedia({audio:{
      echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
  }catch(e){
    el.sub.textContent='マイクの許可が必要です（設定から許可してね）';
    return;
  }
  audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  const src=audioCtx.createMediaStreamSource(stream);
  analyser=audioCtx.createAnalyser();
  analyser.fftSize=2048;
  buf=new Float32Array(analyser.fftSize);
  src.connect(analyser);
  running=true;
  el.status.textContent='きいています';
  el.toggle.textContent='とめる';el.toggle.classList.add('stop');
  update();
}
function stop(){
  running=false;cancelAnimationFrame(rafId);
  if(stream)stream.getTracks().forEach(t=>t.stop());
  if(audioCtx)audioCtx.close();
  el.status.textContent='とまっています';
  el.toggle.textContent='はじめる';el.toggle.classList.remove('stop');
  el.big.textContent='–';el.alpha.textContent='';
  el.sub.textContent='マイクをオンにして、音をひとつのばしてみて';
  el.cents.textContent='';el.marker.style.left='50%';
  el.marker.className='marker';el.sun.classList.remove('shine');
}

function autoCorrelate(b,sampleRate){
  let SIZE=b.length,rms=0;
  for(let i=0;i<SIZE;i++)rms+=b[i]*b[i];
  rms=Math.sqrt(rms/SIZE);
  if(rms<0.01)return -1;
  let r1=0,r2=SIZE-1,thres=0.2;
  for(let i=0;i<SIZE/2;i++)if(Math.abs(b[i])<thres){r1=i;break;}
  for(let i=1;i<SIZE/2;i++)if(Math.abs(b[SIZE-i])<thres){r2=SIZE-i;break;}
  b=b.slice(r1,r2);SIZE=b.length;
  const c=new Array(SIZE).fill(0);
  for(let i=0;i<SIZE;i++)for(let j=0;j<SIZE-i;j++)c[i]+=b[j]*b[j+i];
  let d=0;while(c[d]>c[d+1])d++;
  let maxval=-1,maxpos=-1;
  for(let i=d;i<SIZE;i++){if(c[i]>maxval){maxval=c[i];maxpos=i;}}
  let T0=maxpos;
  if(T0<=0)return -1;
  const x1=c[T0-1],x2=c[T0],x3=c[T0+1]||0;
  const a=(x1+x3-2*x2)/2,bb=(x3-x1)/2;
  if(a)T0=T0-bb/(2*a);
  return sampleRate/T0;
}

function showPraise(){
  el.praise.textContent=PRAISE[Math.floor(Math.random()*PRAISE.length)];
  el.praise.classList.add('show');
  clearTimeout(praiseTimer);
  praiseTimer=setTimeout(()=>el.praise.classList.remove('show'),2200);
}

function update(){
  analyser.getFloatTimeDomainData(buf);
  const freq=autoCorrelate(buf,audioCtx.sampleRate);
  if(freq!==-1&&freq>40&&freq<2000){
    const refA=parseFloat(el.refA.value);
    const tp=parseInt(el.transpose.value);
    const exact=12*Math.log2(freq/refA)+69;
    const midi=Math.round(exact);
    const cents=Math.round((exact-midi)*100);
    const w=midi+tp;                       // 記譜（アルトサックスの音）
    const wName=DOREMI[((w%12)+12)%12];
    const wAlpha=ALPHA[((w%12)+12)%12];
    const wOct=Math.floor(w/12)-1;
    const cName=ALPHA[((midi%12)+12)%12];  // 実音
    const cOct=Math.floor(midi/12)-1;
    el.big.textContent=wName;
    el.big.classList.toggle('small-kana',wName.length>=2);
    el.alpha.textContent=wAlpha+wOct;
    el.sub.innerHTML='実音 <b>'+cName+cOct+'</b>　'+freq.toFixed(1)+' Hz';
    const pos=50+Math.max(-50,Math.min(50,cents));
    el.marker.style.left=pos+'%';
    const inTune=Math.abs(cents)<=5;
    el.marker.className='marker '+(inTune?'ok':(Math.abs(cents)<15?'near':''));
    el.cents.textContent=(cents>0?'+':'')+cents+' cent';
    el.cents.className='cents'+(inTune?' ok':'');
    el.sun.classList.toggle('shine',inTune);
    if(inTune){
      okFrames++;
      if(okFrames>=45&&!counted){   // 約0.75秒キープでカウント
        counted=true;hits++;
        localStorage.setItem(todayKey,hits);
        el.count.textContent='きょうのぴったり '+hits+'回';
        showPraise();
      }
    }else{
      okFrames=0;counted=false;
    }
  }
  rafId=requestAnimationFrame(update);
}

el.toggle.addEventListener('click',()=>running?stop():start());
</script>
</body>
</html>
