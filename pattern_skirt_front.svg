<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="345mm" height="710mm"
     viewBox="0 0 345 710">

  <rect width="345" height="710" fill="white"/>

  <!-- ===== TITLE ===== -->
  <text x="10" y="9" font-size="7.5" font-family="sans-serif" font-weight="bold" fill="#111">前スカート Front Skirt ／ わ取り1枚（前中心＝わ）</text>
  <text x="10" y="16" font-size="5.5" font-family="sans-serif" fill="#555">縫い代：上辺1cm込み、脇1cm込み、裾3cm込み　前中心はわ（縫い代なし）</text>

  <!-- ===== GRID 50mm=5cm ===== -->
  <g stroke="#d8d8d8" stroke-width="0.3" fill="none">
    <line x1="10"  y1="20" x2="10"  y2="700"/>
    <line x1="60"  y1="20" x2="60"  y2="700"/>
    <line x1="110" y1="20" x2="110" y2="700"/>
    <line x1="160" y1="20" x2="160" y2="700"/>
    <line x1="210" y1="20" x2="210" y2="700"/>
    <line x1="260" y1="20" x2="260" y2="700"/>
    <line x1="310" y1="20" x2="310" y2="700"/>
    <line x1="10" y1="20"  x2="335" y2="20"/>
    <line x1="10" y1="70"  x2="335" y2="70"/>
    <line x1="10" y1="120" x2="335" y2="120"/>
    <line x1="10" y1="170" x2="335" y2="170"/>
    <line x1="10" y1="220" x2="335" y2="220"/>
    <line x1="10" y1="270" x2="335" y2="270"/>
    <line x1="10" y1="320" x2="335" y2="320"/>
    <line x1="10" y1="370" x2="335" y2="370"/>
    <line x1="10" y1="420" x2="335" y2="420"/>
    <line x1="10" y1="470" x2="335" y2="470"/>
    <line x1="10" y1="520" x2="335" y2="520"/>
    <line x1="10" y1="570" x2="335" y2="570"/>
    <line x1="10" y1="620" x2="335" y2="620"/>
    <line x1="10" y1="670" x2="335" y2="670"/>
  </g>

  <!-- Grid labels -->
  <g font-size="5" fill="#bbb" font-family="sans-serif" text-anchor="middle">
    <text x="60"  y="19">5cm</text>
    <text x="110" y="19">10</text>
    <text x="160" y="19">15</text>
    <text x="210" y="19">20</text>
    <text x="260" y="19">25</text>
    <text x="310" y="19">30cm</text>
  </g>
  <g font-size="5" fill="#bbb" font-family="sans-serif">
    <text x="2" y="23">0</text>
    <text x="2" y="73">5</text>
    <text x="2" y="123">10</text>
    <text x="2" y="173">15</text>
    <text x="2" y="223">20</text>
    <text x="2" y="273">25</text>
    <text x="2" y="323">30</text>
    <text x="2" y="373">35</text>
    <text x="2" y="423">40</text>
    <text x="2" y="473">45</text>
    <text x="2" y="523">50</text>
    <text x="2" y="573">55</text>
    <text x="2" y="623">60</text>
    <text x="2" y="673">65cm</text>
  </g>

  <!-- ===== FOLD LINE (center front = わ) ===== -->
  <line x1="10" y1="20" x2="10" y2="700"
        stroke="#009900" stroke-width="0.8" stroke-dasharray="6,2,1,2"/>
  <text x="13" y="400" font-size="7" fill="#009900" font-family="sans-serif"
        transform="rotate(90,13,400)">わ（前中心・折り目）</text>

  <!-- ===== PATTERN OUTLINE ===== -->
  <!--
    Same A-line shape as back skirt.
    TopCF   = (10,  20)
    TopSide = (220, 20)
    HipSide = (262, 220)
    HemSide = (330, 690)
    HemCF   = (10,  690)
  -->
  <path d="M 10,20
           L 220,20
           L 262,220
           L 330,690
           L 10,690
           Z"
        fill="#FFF5EA" fill-opacity="0.6"
        stroke="black" stroke-width="1.3" stroke-linejoin="round"/>

  <!-- Hip level guide line -->
  <line x1="10" y1="220" x2="270" y2="220"
        stroke="#999" stroke-width="0.5" stroke-dasharray="3,2"/>
  <text x="265" y="218" font-size="5" fill="#999" font-family="sans-serif">HL</text>

  <!-- Hem line -->
  <line x1="10" y1="690" x2="335" y2="690"
        stroke="#CC0044" stroke-width="0.6" stroke-dasharray="4,2"/>
  <!-- Fold line for hem -->
  <line x1="10" y1="660" x2="330" y2="660"
        stroke="#CC0044" stroke-width="0.4" stroke-dasharray="2,2"/>
  <text x="335" y="676" font-size="5" fill="#CC0044" font-family="sans-serif">裾（3cm三つ折り）</text>

  <!-- ===== TUCKS at top (タック) ===== -->
  <!--
    2本のタック（身頃との切り替え線でたたむ）
    Tuck 1: center at x=55, width=10mm → fold lines at x=50 and x=60
    Tuck 2: center at x=85, width=10mm → fold lines at x=80 and x=90
    Tuck depth: 50mm (from top seam down to y=70)
    Tucks fold toward center front (left / toward x=10)
  -->
  <!-- Tuck 1 -->
  <line x1="50" y1="20" x2="50" y2="70" stroke="#993300" stroke-width="0.9" stroke-dasharray="3,2"/>
  <line x1="60" y1="20" x2="60" y2="70" stroke="#993300" stroke-width="0.9" stroke-dasharray="3,2"/>
  <!-- Tuck 1 fold arrow -->
  <path d="M 60,45 L 50,45" stroke="#993300" stroke-width="0.8" marker-end="url(#arrow)"/>
  <!-- Tuck 2 -->
  <line x1="80" y1="20" x2="80" y2="70" stroke="#993300" stroke-width="0.9" stroke-dasharray="3,2"/>
  <line x1="90" y1="20" x2="90" y2="70" stroke="#993300" stroke-width="0.9" stroke-dasharray="3,2"/>
  <!-- Tuck 2 fold arrow -->
  <path d="M 90,55 L 80,55" stroke="#993300" stroke-width="0.8"/>

  <!-- Tuck labels -->
  <text x="42" y="80" font-size="5" fill="#993300" font-family="sans-serif">タック1</text>
  <text x="72" y="80" font-size="5" fill="#993300" font-family="sans-serif">タック2</text>
  <text x="30" y="88" font-size="5" fill="#993300" font-family="sans-serif">各1cm幅・深さ5cm・前中心側に倒す</text>

  <!-- Tuck stitch end dots -->
  <circle cx="50" cy="70" r="2" fill="#993300"/>
  <circle cx="60" cy="70" r="2" fill="#993300"/>
  <circle cx="80" cy="70" r="2" fill="#993300"/>
  <circle cx="90" cy="70" r="2" fill="#993300"/>

  <!-- ===== GRAIN LINE ===== -->
  <line x1="10" y1="360" x2="10" y2="480" stroke="#333" stroke-width="0.9"/>
  <polygon points="6.5,477 10,487 13.5,477" fill="#333"/>
  <text x="14" y="430" font-size="6" font-family="sans-serif" fill="#333">地の目</text>

  <!-- ===== NOTCHES ===== -->
  <line x1="113" y1="16" x2="113" y2="24" stroke="black" stroke-width="1.2"/>
  <line x1="258" y1="216" x2="266" y2="224" stroke="black" stroke-width="1.2"/>
  <line x1="170" y1="686" x2="170" y2="694" stroke="black" stroke-width="1.2"/>

  <!-- ===== KEY POINT DOTS ===== -->
  <circle cx="10"  cy="20"  r="2" fill="#333"/>
  <circle cx="220" cy="20"  r="2" fill="#333"/>
  <circle cx="262" cy="220" r="2" fill="#333"/>
  <circle cx="330" cy="690" r="2" fill="#333"/>

  <!-- ===== LABELS ===== -->
  <g font-family="sans-serif" fill="#222">
    <text x="85" y="200" font-size="10" font-weight="bold">前</text>
    <text x="170" y="35" font-size="5.5" text-anchor="middle">切り替え線（上辺）UB/4=21cm</text>
  </g>

  <!-- ===== DIMENSION LINES ===== -->
  <g stroke="#999" stroke-width="0.4">
    <line x1="337" y1="20"  x2="337" y2="690"/>
    <line x1="335" y1="20"  x2="339" y2="20"/>
    <line x1="335" y1="690" x2="339" y2="690"/>
  </g>
  <text x="341" y="358" font-size="5" fill="#777" font-family="sans-serif"
        transform="rotate(90,341,358)">スカート丈 67cm（裾3cm込み）</text>

  <g stroke="#999" stroke-width="0.4">
    <line x1="10"  y1="14" x2="220" y2="14"/>
    <line x1="10"  y1="12" x2="10"  y2="16"/>
    <line x1="220" y1="12" x2="220" y2="16"/>
  </g>
  <text x="115" y="13" font-size="5" fill="#777" font-family="sans-serif" text-anchor="middle">上辺 21cm</text>

  <g stroke="#999" stroke-width="0.4">
    <line x1="10"  y1="697" x2="330" y2="697"/>
    <line x1="10"  y1="695" x2="10"  y2="699"/>
    <line x1="330" y1="695" x2="330" y2="699"/>
  </g>
  <text x="170" y="705" font-size="5" fill="#777" font-family="sans-serif" text-anchor="middle">裾幅 32cm（総裾幅128cm）</text>

  <!-- ===== TUCK GUIDE (how to fold) ===== -->
  <rect x="155" y="80" width="160" height="50" rx="3"
        fill="#FFF8E0" stroke="#CC8800" stroke-width="0.5"/>
  <text x="160" y="91" font-size="5.5" fill="#884400" font-family="sans-serif" font-weight="bold">タックのたたみ方</text>
  <text x="160" y="100" font-size="5"  fill="#884400" font-family="sans-serif">① 点線（外側）を実線（内側）に合わせて折る</text>
  <text x="160" y="108" font-size="5"  fill="#884400" font-family="sans-serif">② 前中心方向（わ側）に倒してアイロン</text>
  <text x="160" y="116" font-size="5"  fill="#884400" font-family="sans-serif">③ 上辺5cmをしつけ糸で仮縫いしてから</text>
  <text x="160" y="124" font-size="5"  fill="#884400" font-family="sans-serif">　 身頃と切り替え縫い</text>

  <!-- ===== NOTES ===== -->
  <text x="10" y="708" font-size="5.5" fill="#555" font-family="sans-serif">
    ※前中心で生地を折り（わ）1枚裁ち　タックで立体感を出しウエスト細見え効果
  </text>
</svg>
