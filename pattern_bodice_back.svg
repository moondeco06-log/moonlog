<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="262mm" height="355mm"
     viewBox="0 0 262 355">

  <rect width="262" height="355" fill="white"/>

  <!-- ===== TITLE ===== -->
  <text x="10" y="9" font-size="7.5" font-family="sans-serif" font-weight="bold" fill="#111">後ろ身頃 Back Bodice ／ 2枚裁ち</text>
  <text x="10" y="16" font-size="5.5" font-family="sans-serif" fill="#555">縫い代：周囲1cm込み（後ろ中心・脇・肩・アームホール・切り替え線）</text>

  <!-- ===== GRID 50mm=5cm ===== -->
  <g stroke="#d8d8d8" stroke-width="0.3" fill="none">
    <line x1="10" y1="20" x2="10" y2="345"/>
    <line x1="60" y1="20" x2="60" y2="345"/>
    <line x1="110" y1="20" x2="110" y2="345"/>
    <line x1="160" y1="20" x2="160" y2="345"/>
    <line x1="210" y1="20" x2="210" y2="345"/>
    <line x1="242" y1="20" x2="242" y2="345"/>
    <line x1="10" y1="25" x2="252" y2="25"/>
    <line x1="10" y1="75" x2="252" y2="75"/>
    <line x1="10" y1="125" x2="252" y2="125"/>
    <line x1="10" y1="175" x2="252" y2="175"/>
    <line x1="10" y1="225" x2="252" y2="225"/>
    <line x1="10" y1="275" x2="252" y2="275"/>
    <line x1="10" y1="325" x2="252" y2="325"/>
  </g>

  <!-- Grid scale labels -->
  <g font-size="5" fill="#bbb" font-family="sans-serif" text-anchor="middle">
    <text x="10"  y="20">0</text>
    <text x="60"  y="20">5cm</text>
    <text x="110" y="20">10</text>
    <text x="160" y="20">15</text>
    <text x="210" y="20">20</text>
  </g>
  <g font-size="5" fill="#bbb" font-family="sans-serif">
    <text x="2" y="78">5</text>
    <text x="2" y="128">10</text>
    <text x="2" y="178">15</text>
    <text x="2" y="228">20</text>
    <text x="2" y="278">25</text>
    <text x="2" y="328">30cm</text>
  </g>

  <!-- ===== CENTER BACK LINE (orange dashed) ===== -->
  <line x1="10" y1="20" x2="10" y2="345"
        stroke="#FF6600" stroke-width="0.6" stroke-dasharray="4,3"/>

  <!-- Back opening area -->
  <line x1="10" y1="25" x2="10" y2="175"
        stroke="#FF6600" stroke-width="1.8" stroke-dasharray="0,0" opacity="0.4"/>
  <text x="13" y="95" font-size="5.5" fill="#FF6600" font-family="sans-serif">← 後ろあき</text>
  <text x="13" y="102" font-size="5.5" fill="#FF6600" font-family="sans-serif">   15cm</text>
  <text x="13" y="109" font-size="5.5" fill="#FF6600" font-family="sans-serif">   (ジッパー)</text>

  <!-- ===== PATTERN OUTLINE ===== -->
  <!--
    Key coordinates (mm from top-left):
    BNP   = (10, 25)   ← center back, back neck point
    SNP   = (75, 17)   ← shoulder neck point (65mm right, 8mm above BNP)
    SP    = (200, 45)  ← shoulder point (190mm from CB, drops 20mm)
    UA    = (242, 235) ← underarm / side seam top (232mm from CB, 210mm below BNP)
    EmpSd = (220, 335) ← empire seam at side (210mm from CB, 310mm below BNP)
    EmpCB = (10, 335)  ← empire seam at center back
  -->
  <path d="M 10,25
           Q 38,13 75,17
           L 200,45
           C 218,110 248,205 242,235
           L 220,335
           L 10,335
           Z"
        fill="#EDF5FF" fill-opacity="0.6"
        stroke="black" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Empire seam line (blue dashed) -->
  <line x1="10" y1="335" x2="252" y2="335"
        stroke="#0055CC" stroke-width="0.6" stroke-dasharray="5,3"/>

  <!-- ===== GRAIN LINE ===== -->
  <line x1="10" y1="190" x2="125" y2="190" stroke="#333" stroke-width="0.9"/>
  <polygon points="121,186.5 130,190 121,193.5" fill="#333"/>

  <!-- ===== NOTCHES ===== -->
  <!-- SP notch -->
  <line x1="196" y1="41" x2="204" y2="49" stroke="black" stroke-width="1.2"/>
  <!-- Underarm notch -->
  <line x1="238" y1="228" x2="246" y2="242" stroke="black" stroke-width="1.2"/>
  <!-- Empire center notch -->
  <line x1="113" y1="331" x2="113" y2="339" stroke="black" stroke-width="1.2"/>

  <!-- ===== KEY POINT DOTS ===== -->
  <circle cx="10"  cy="25"  r="1.8" fill="#333"/>
  <circle cx="75"  cy="17"  r="1.8" fill="#333"/>
  <circle cx="200" cy="45"  r="1.8" fill="#333"/>
  <circle cx="242" cy="235" r="1.8" fill="#333"/>
  <circle cx="220" cy="335" r="1.8" fill="#333"/>

  <!-- ===== LABELS ===== -->
  <g font-family="sans-serif" fill="#222">
    <text x="12" y="24"  font-size="5">BNP</text>
    <text x="77" y="15"  font-size="5">SNP</text>
    <text x="202" y="43" font-size="5">SP</text>
    <text x="244" y="233" font-size="5">脇線</text>
    <text x="55" y="198" font-size="6.5" font-weight="bold">後ろ</text>
    <text x="55" y="207" font-size="5.5">地の目 →</text>
  </g>

  <!-- Empire line label -->
  <text x="80" y="332" font-size="5.5" fill="#0055CC" font-family="sans-serif">切り替え線（アンダーバスト）</text>

  <!-- ===== DIMENSION LINES ===== -->
  <!-- Back bodice length: BNP to empire -->
  <g stroke="#999" stroke-width="0.4">
    <line x1="252" y1="25"  x2="252" y2="335"/>
    <line x1="250" y1="25"  x2="254" y2="25"/>
    <line x1="250" y1="335" x2="254" y2="335"/>
  </g>
  <text x="256" y="183" font-size="5" fill="#777" font-family="sans-serif"
        transform="rotate(90,256,183)">後ろ身丈 31cm</text>

  <!-- Bust width: CB to side -->
  <g stroke="#999" stroke-width="0.4">
    <line x1="10"  y1="238" x2="242" y2="238"/>
    <line x1="10"  y1="236" x2="10"  y2="240"/>
    <line x1="242" y1="236" x2="242" y2="240"/>
  </g>
  <text x="120" y="245" font-size="5" fill="#777" font-family="sans-serif" text-anchor="middle">
    バスト幅 23.2cm（ゆとり込み）
  </text>

  <!-- ===== NOTES ===== -->
  <text x="10" y="348" font-size="5.5" fill="#555" font-family="sans-serif">
    ※100%で印刷してください　5cmグリッドで実寸確認を　後ろ中心は縫い代込みのため直接縫わず1cm内側で縫製
  </text>
</svg>
