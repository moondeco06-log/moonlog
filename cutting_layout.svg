<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="340mm" height="220mm"
     viewBox="0 0 340 220">

  <title>ジャケット 裁断レイアウト（150cm幅 × 約1.8m）</title>
  <rect width="340" height="220" fill="#fafaf8"/>

  <!-- タイトル -->
  <text x="10" y="14" font-size="11" font-weight="bold" font-family="sans-serif">裁断レイアウト図　ポンチニット 150cm幅 × 1.8m</text>
  <text x="10" y="26" font-size="8" font-family="sans-serif" fill="#888">縮尺 1:5（図上1mm ＝ 実物5mm）　※折りなし・地の目縦</text>

  <!-- ===== 布の外枠 150cm幅 × 180cm長さ → 縮尺1:5で 300×360 → 表示上は 300×360を収めるため 1:6にしよう ===== -->
  <!-- 縮尺1:5: 150cm=300mm, 180cm=360mm → 大きすぎる。1:6にする: 150cm=250mm, 180cm=300mm -->
  <!-- 実際の計算: 1mm SVG = 6mm 実物 -->

  <!-- 布エリア: x=20, y=34, width=250(=150cm), height=300(=180cm) -->
  <rect x="20" y="34" width="250" height="172" fill="#f0ede8" stroke="#888" stroke-width="1.2"/>

  <!-- 布端ラベル -->
  <text x="20" y="32" font-size="7" fill="#888">耳←</text>
  <text x="256" y="32" font-size="7" fill="#888">→耳</text>
  <line x1="20" y1="33" x2="270" y2="33" stroke="#bbb" stroke-width="0.5"/>
  <line x1="20" y1="207" x2="270" y2="207" stroke="#bbb" stroke-width="0.5"/>

  <!-- 幅寸法 -->
  <line x1="20" y1="210" x2="270" y2="210" stroke="#999" stroke-width="0.5"/>
  <line x1="20" y1="208" x2="20" y2="212" stroke="#999" stroke-width="0.5"/>
  <line x1="270" y1="208" x2="270" y2="212" stroke="#999" stroke-width="0.5"/>
  <text x="115" y="218" font-size="8" fill="#555">← 150cm →</text>

  <!-- 丈寸法 -->
  <line x1="14" y1="34" x2="14" y2="206" stroke="#999" stroke-width="0.5"/>
  <line x1="12" y1="34" x2="16" y2="34" stroke="#999" stroke-width="0.5"/>
  <line x1="12" y1="206" x2="16" y2="206" stroke="#999" stroke-width="0.5"/>
  <text x="4" y="125" font-size="8" fill="#555" transform="rotate(-90,4,125)">約108cm</text>

  <!-- =============================================
       パーツ配置（縮尺1:6）
       実寸mm → SVG座標: 実寸/6 + オフセット
       布の左上 = SVG (20, 34)

       後ろ身頃: 実寸270×730 → 45×122
       前中心パネル: 実寸190×650 → 32×108
       前サイドパネル: 実寸160×610 → 27×102
       袖: 実寸300×590 → 50×98 ×2枚
       パーツA(前見返し): 実寸90×670 → 15×112 ×2枚
       パーツB(後ろカラー): 実寸125×64 → 21×11 ×2枚
  ============================================= -->

  <!-- ─── 後ろ身頃 × 2枚（左右対称） ─── -->
  <!-- 1枚目: 左端から -->
  <rect x="22" y="36" width="45" height="122" fill="#b8d4e8" stroke="#3a7bb5" stroke-width="1"/>
  <text x="44" y="88" font-size="7" font-weight="bold" font-family="sans-serif" fill="#1a4a6e"
        text-anchor="middle">後ろ身頃</text>
  <text x="44" y="100" font-size="6" font-family="sans-serif" fill="#1a4a6e" text-anchor="middle">①</text>

  <!-- 2枚目: 隣に -->
  <rect x="69" y="36" width="45" height="122" fill="#b8d4e8" stroke="#3a7bb5" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="91" y="88" font-size="7" font-weight="bold" font-family="sans-serif" fill="#1a4a6e"
        text-anchor="middle">後ろ身頃</text>
  <text x="91" y="100" font-size="6" font-family="sans-serif" fill="#1a4a6e" text-anchor="middle">②(裏返し)</text>

  <!-- ─── 前中心パネル × 2枚 ─── -->
  <rect x="116" y="36" width="32" height="108" fill="#c8e8c0" stroke="#2e7a2e" stroke-width="1"/>
  <text x="132" y="82" font-size="7" font-weight="bold" font-family="sans-serif" fill="#1a4a1e"
        text-anchor="middle">前中心</text>
  <text x="132" y="92" font-size="6" font-family="sans-serif" fill="#1a4a1e" text-anchor="middle">パネル①</text>

  <rect x="150" y="36" width="32" height="108" fill="#c8e8c0" stroke="#2e7a2e" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="166" y="82" font-size="7" font-weight="bold" font-family="sans-serif" fill="#1a4a1e"
        text-anchor="middle">前中心</text>
  <text x="166" y="92" font-size="6" font-family="sans-serif" fill="#1a4a1e" text-anchor="middle">パネル②</text>

  <!-- ─── 前サイドパネル × 2枚 ─── -->
  <rect x="184" y="36" width="27" height="102" fill="#f0d8a0" stroke="#9a6e00" stroke-width="1"/>
  <text x="197" y="78" font-size="7" font-weight="bold" font-family="sans-serif" fill="#5a3e00"
        text-anchor="middle">前</text>
  <text x="197" y="88" font-size="7" font-family="sans-serif" fill="#5a3e00" text-anchor="middle">サイド</text>
  <text x="197" y="98" font-size="6" font-family="sans-serif" fill="#5a3e00" text-anchor="middle">①</text>

  <rect x="213" y="36" width="27" height="102" fill="#f0d8a0" stroke="#9a6e00" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="226" y="78" font-size="7" font-weight="bold" font-family="sans-serif" fill="#5a3e00"
        text-anchor="middle">前</text>
  <text x="226" y="88" font-size="7" font-family="sans-serif" fill="#5a3e00" text-anchor="middle">サイド</text>
  <text x="226" y="98" font-size="6" font-family="sans-serif" fill="#5a3e00" text-anchor="middle">②</text>

  <!-- ─── パーツA(前見返し) × 2枚 ─── -->
  <rect x="242" y="36" width="15" height="112" fill="#e8c8e8" stroke="#7a2e7a" stroke-width="1"/>
  <text x="249" y="88" font-size="6" font-weight="bold" font-family="sans-serif" fill="#4a1e4a"
        text-anchor="middle" transform="rotate(-90,249,88)">前見返し①</text>

  <rect x="258" y="36" width="15" height="112" fill="#e8c8e8" stroke="#7a2e7a" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="265" y="88" font-size="6" font-weight="bold" font-family="sans-serif" fill="#4a1e4a"
        text-anchor="middle" transform="rotate(-90,265,88)">前見返し②</text>

  <!-- ─── 袖 × 2枚 ─── -->
  <rect x="22" y="160" width="50" height="44" fill="#f0b8b8" stroke="#c03030" stroke-width="1"/>
  <text x="47" y="180" font-size="7" font-weight="bold" font-family="sans-serif" fill="#7a1010"
        text-anchor="middle">袖①</text>
  <text x="47" y="192" font-size="6" font-family="sans-serif" fill="#7a1010" text-anchor="middle">（左）</text>

  <rect x="74" y="160" width="50" height="44" fill="#f0b8b8" stroke="#c03030" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="99" y="180" font-size="7" font-weight="bold" font-family="sans-serif" fill="#7a1010"
        text-anchor="middle">袖②</text>
  <text x="99" y="192" font-size="6" font-family="sans-serif" fill="#7a1010" text-anchor="middle">（右・裏返し）</text>

  <!-- ─── パーツB(後ろカラー) × 2枚 ─── -->
  <rect x="126" y="160" width="21" height="11" fill="#d0c8f0" stroke="#4a3a9a" stroke-width="1"/>
  <text x="136" y="168" font-size="5.5" font-family="sans-serif" fill="#2a1a7a" text-anchor="middle">後カラー①</text>

  <rect x="150" y="160" width="21" height="11" fill="#d0c8f0" stroke="#4a3a9a" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="160" y="168" font-size="5.5" font-family="sans-serif" fill="#2a1a7a" text-anchor="middle">後カラー②</text>

  <!-- 残り布エリア表示 -->
  <rect x="175" y="155" width="93" height="50" fill="none" stroke="#ccc" stroke-width="0.5" stroke-dasharray="3,3"/>
  <text x="221" y="178" font-size="7" fill="#bbb" text-anchor="middle">余り布</text>
  <text x="221" y="190" font-size="6" fill="#bbb" text-anchor="middle">（約0.6m分）</text>

  <!-- =============================================
       凡例
  ============================================= -->
  <rect x="280" y="34" width="55" height="168" fill="white" stroke="#ddd" stroke-width="0.8" rx="3"/>
  <text x="307" y="46" font-size="8" font-weight="bold" font-family="sans-serif" text-anchor="middle">凡例</text>

  <rect x="285" y="52" width="12" height="8" fill="#b8d4e8" stroke="#3a7bb5" stroke-width="0.8"/>
  <text x="301" y="60" font-size="7" font-family="sans-serif">後ろ身頃</text>

  <rect x="285" y="66" width="12" height="8" fill="#c8e8c0" stroke="#2e7a2e" stroke-width="0.8"/>
  <text x="301" y="74" font-size="7" font-family="sans-serif">前中心</text>

  <rect x="285" y="80" width="12" height="8" fill="#f0d8a0" stroke="#9a6e00" stroke-width="0.8"/>
  <text x="301" y="88" font-size="7" font-family="sans-serif">前サイド</text>

  <rect x="285" y="94" width="12" height="8" fill="#f0b8b8" stroke="#c03030" stroke-width="0.8"/>
  <text x="301" y="102" font-size="7" font-family="sans-serif">袖</text>

  <rect x="285" y="108" width="12" height="8" fill="#e8c8e8" stroke="#7a2e7a" stroke-width="0.8"/>
  <text x="301" y="116" font-size="7" font-family="sans-serif">前見返し</text>

  <rect x="285" y="122" width="12" height="8" fill="#d0c8f0" stroke="#4a3a9a" stroke-width="0.8"/>
  <text x="301" y="130" font-size="7" font-family="sans-serif">後ろカラー</text>

  <line x1="284" y1="138" x2="332" y2="138" stroke="#eee" stroke-width="0.5"/>

  <text x="284" y="150" font-size="6.5" font-family="sans-serif" fill="#666">実線：表向き</text>
  <text x="284" y="161" font-size="6.5" font-family="sans-serif" fill="#666">破線：裏向き</text>
  <text x="284" y="172" font-size="6.5" font-family="sans-serif" fill="#666">（左右対称に</text>
  <text x="284" y="182" font-size="6.5" font-family="sans-serif" fill="#666">　裁断）</text>
  <text x="284" y="196" font-size="6.5" font-weight="bold" font-family="sans-serif" fill="#c03030">合計12枚</text>

</svg>
