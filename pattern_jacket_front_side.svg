<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="220mm" height="660mm"
     viewBox="0 0 220 660">

  <title>ジャケット 前サイドパネル</title>
  <rect width="220" height="660" fill="white"/>

  <!-- ===== メイン輪郭 ===== -->
  <!-- PSノッチ(10,10) → 袖ぐり下部カーブ → UA(145,105)
       → 脇線 → 裾脇(168,620) → 裾PS(10,620) → PSライン → PSノッチ
  -->
  <path d="
    M 10,10
    Q 50,10 92,50
    Q 122,80 145,105
    L 140,305
    Q 147,385 154,450
    L 168,620
    L 10,620
    Q 12,450 15,450
    Q 14,305 16,305
    Q 13,160 10,105
    Q 10,60 10,10
    Z
  " fill="none" stroke="black" stroke-width="1.5"/>

  <!-- PSノッチ（上部 - 袖ぐり合印）
       M 10,10 が輪郭上の点。円は path 上に正確に配置 -->
  <circle cx="10" cy="10" r="3" fill="none" stroke="black" stroke-width="1.5"/>

  <!-- 脇シームノッチ（ウエスト位置）
       脇線 L 140,305 の端点付近 (140,305) を挟む水平ノッチ -->
  <line x1="133" y1="305" x2="150" y2="305" stroke="black" stroke-width="2"/>

  <!-- 地の目線（縦） -->
  <line x1="90" y1="130" x2="90" y2="580"
        stroke="black" stroke-width="0.8" stroke-dasharray="12,5"/>
  <polygon points="90,125 86,140 94,140" fill="black"/>
  <polygon points="90,585 86,570 94,570" fill="black"/>
  <text x="95" y="370" font-size="10" font-family="sans-serif">地の目</text>

  <!-- ===== ラベル ===== -->
  <text x="20" y="220" font-size="15" font-weight="bold" font-family="sans-serif">前サイドパネル</text>
  <text x="20" y="242" font-size="12" font-family="sans-serif">× 2枚（左右対称）</text>
  <text x="20" y="262" font-size="10" font-family="sans-serif">縫い代 10mm込み</text>
  <text x="20" y="278" font-size="10" font-family="sans-serif">裾のみ 15mm込み</text>

  <!-- 辺ラベル: rotate around x=12 to keep within viewBox left edge -->
  <text x="12" y="360" font-size="9" font-family="sans-serif" fill="#555"
        transform="rotate(-90,12,360)">← プリンセスシーム</text>
  <!-- 右辺ラベル: rotate around x=210 to keep within viewBox right edge (220) -->
  <text x="210" y="420" font-size="9" font-family="sans-serif" fill="#555"
        transform="rotate(90,210,420)">脇シーム →</text>

  <!-- ===== 寸法線 ===== -->
  <!-- バスト幅（PS〜脇） -->
  <line x1="10" y1="108" x2="145" y2="108" stroke="#bbb" stroke-width="0.5" stroke-dasharray="4,3"/>
  <text x="40" y="120" font-size="8" font-family="sans-serif" fill="#bbb">PS〜脇 約14cm</text>

  <!-- 裾幅 -->
  <line x1="10" y1="634" x2="168" y2="634" stroke="#bbb" stroke-width="0.5" stroke-dasharray="4,3"/>
  <text x="40" y="645" font-size="8" font-family="sans-serif" fill="#bbb">裾幅 約17cm</text>

  <!-- 丈: move line to x=6 and rotate text around x=11 -->
  <line x1="6" y1="105" x2="6" y2="620" stroke="#999" stroke-width="0.5"/>
  <line x1="4" y1="105" x2="8" y2="105" stroke="#999" stroke-width="0.5"/>
  <line x1="4" y1="620" x2="8" y2="620" stroke="#999" stroke-width="0.5"/>
  <text x="11" y="380" font-size="8" font-family="sans-serif" fill="#777"
        transform="rotate(-90,11,380)">約51cm（UA〜裾）</text>

  <!-- ===== 点ラベル ===== -->
  <!-- PSノッチ circle is at (10,10). Label placed to the right and below to avoid overlap -->
  <text x="16" y="22" font-size="7" fill="#aaa">PSノッチ</text>
  <!-- UA(145,105): label to the right -->
  <text x="148" y="109" font-size="7" fill="#aaa">UA</text>

  <!-- ===== 後ろとの合わせ方 ===== -->
  <rect x="10" y="628" width="200" height="26" fill="#f5f5f5" stroke="#ccc" stroke-width="0.5"/>
  <text x="15" y="639" font-size="8" font-family="sans-serif" fill="#666">※PSノッチ（○印）を前中心パネルのPSノッチに合わせる</text>
  <text x="15" y="650" font-size="8" font-family="sans-serif" fill="#666">※脇線は後ろ身頃の脇線と縫い合わせる</text>

</svg>
